[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced-therapy-switch-benchmark"
version = "0.1.0"
description = "Independent raw-data baselines and HCP prioritization."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Claims Analytics Team"}]
dependencies = [
  "joblib>=1.2", "numpy>=1.23", "pandas>=1.5", "pyarrow>=12.0",
  "PyYAML>=6.0", "scikit-learn>=1.2", "lightgbm>=4.0"
]

[project.optional-dependencies]
snowflake = ["snowflake-snowpark-python>=1.14"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
therapy-switch = "therapy_switch.delivery.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
