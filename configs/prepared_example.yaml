# Prepared table template. Feature lineage deliberately fails until reviewed and affirmed.
project:
  name: advanced_therapy_benchmark
  random_seed: 42
  output_dir: outputs/governed_benchmark
  artifact_dir: artifacts/governed_benchmark
data:
  source: prepared_files
  as_of_date: '2000-01-01'
  input_dir: data/prepared
  file_format: parquet
  feature_columns:
  - example_prior_claim_count
  feature_lineage:
    example_prior_claim_count:
      available_at_index: false
      definition: REPLACE_WITH_REVIEWED_DEFINITION
      dtype: numeric
  tables:
    snapshots:
      file: snapshots.parquet
      columns: {}
    wide:
      file: wide.parquet
      columns: {}
    events:
      file: events.parquet
      columns: {}
timeline:
  observation_window_days: 365
  prediction_window_days: 90
  minimum_history_days: 365
  minimum_followup_days: 90
  index_date_strategy: monthly
  snapshots_per_patient: 3
  claims_lag_days: 7
  label_runout_days: 30
  index_date_start: '1998-01-01'
  index_date_end: '1999-01-01'
therapy_mapping:
  conventional:
  - YOUR_CONVENTIONAL_PRODUCT
  advanced:
  - YOUR_ADVANCED_PRODUCT
cohort:
  cohort_id: YOUR_COHORT
  require_diagnosis_confirmation: true
  diagnosis_codes:
  - YOUR_NT1_CODE
  confirmation_codes:
  - YOUR_CONFIRMATION_CODE
  diagnosis_separation_days: 90
  coverage_window_days: 270
  minimum_covered_days: 135
  maximum_gap_days: null
  require_conventional_on_index: false
features:
  rolling_windows_days:
  - 30
  - 60
  - 90
  - 180
  - 365
  include_geography: true
  missing_recency_value_days: 730
  specialist_specialties:
  - sleep_medicine
  - neurology
  - pulmonology
  - psychiatry
  symptom_codes:
  - YOUR_SYMPTOM_CODE
  comorbidity_codes:
  - YOUR_COMORBIDITY_CODE
  sequence:
    max_length: 96
    vocab_min_frequency: 2
splitting:
  experiments:
  - temporal
  primary_experiment: temporal
  validation_fraction: 0.2
  test_fraction: 0.2
  temporal_gap_days: 0
models:
  naive_baseline:
    enabled: true
  logistic_regression:
    enabled: true
    C: 0.2
    max_iter: 1000
    class_weight: balanced
  lightgbm:
    enabled: true
    n_estimators: 250
    num_leaves: 15
    learning_rate: 0.04
    min_child_samples: 40
  mlp:
    enabled: true
    hidden_dims:
    - 64
    - 32
    dropout: 0.2
    max_epochs: 25
    patience: 5
    losses:
    - bce
  gru:
    enabled: true
    hidden_size: 32
  transformer:
    enabled: true
    d_model: 32
    nhead: 4
    num_layers: 1
    dim_feedforward: 64
  hybrid:
    enabled: true
    hidden_size: 32
  lightgbm_wide:
    enabled: true
  gru_no_time:
    enabled: true
  gru_shuffled:
    enabled: true
  random_forest:
    enabled: false
    n_estimators: 150
    min_samples_leaf: 5
  xgboost:
    enabled: false
    n_estimators: 200
    max_depth: 4
  catboost:
    enabled: false
    iterations: 200
    depth: 5
  lstm:
    enabled: false
    hidden_size: 32
  bilstm:
    enabled: false
    hidden_size: 24
  sequence_training:
    batch_size: 128
    max_epochs: 25
    patience: 5
    learning_rate: 0.001
    num_threads: 2
    dropout: 0.2
tuning:
  enabled: false
  n_trials: 5
evaluation:
  top_fractions:
  - 0.05
  - 0.1
  - 0.2
  threshold_strategy: max_f1
  fixed_threshold: 0.5
  target_recall: 0.7
  bootstrap_iterations: 500
  confidence_level: 0.95
  calibration_bins: 10
  calibrators:
  - none
  - sigmoid
  select_on: pr_auc
hcp:
  attribution_rule: most_recent_relevant_prescriber
  relevant_specialties:
  - sleep_medicine
  - neurology
  targeting_period: Q
  high_propensity_threshold_percentile: 90
  weights:
    expected_switchers: 1.0
  normalization: none
visualizations:
  enabled: true
explainability:
  enabled: true
  prefer_shap: true
  max_samples: 100
  permutation_repeats: 2
recommendation:
  material_pr_auc_gain: 0.01
