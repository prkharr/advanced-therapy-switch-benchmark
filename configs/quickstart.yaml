# Fast smoke-test configuration. All unavailable optional models remain visible as
# NOT APPLICABLE rows; install the corresponding extras to execute them.
project:
  name: advanced_therapy_switch_quickstart
  random_seed: 7
  output_dir: outputs/quickstart
  artifact_dir: artifacts/quickstart

data:
  source: synthetic
  input_dir: data/raw
  file_format: csv
  persist_generated_data: false
  synthetic:
    n_patients: 600
    n_providers: 70
    start_date: "2021-01-01"
    end_date: "2025-12-31"
    target_prevalence: 0.08
    signal_strength: 0.75
    noise_scale: 1.0

timeline:
  observation_window_days: 365
  prediction_window_days: 90
  minimum_history_days: 365
  minimum_followup_days: 90
  index_date_strategy: conventional_claim_anchor
  index_date_start: "2022-01-01"
  index_date_end: "2025-09-30"

therapy_mapping:
  conventional: [CONV_A, CONV_B, CONV_C, GENERIC_D]
  advanced: [ADV_A, ADV_B, ADV_C]

cohort:
  require_conventional_on_index: true
  exclude_prior_advanced: true
  disease_diagnosis_prefixes: [DX1, DX2, DX3]

features:
  rolling_windows_days: [30, 60, 90, 180, 365]
  include_geography: true
  missing_recency_value_days: 730
  safe_ratio_epsilon: 1.0
  sequence:
    max_length: 64
    min_events: 2
    vocab_min_frequency: 1
    include_provider_specialty: true

splitting:
  experiments: [stratified, temporal]
  primary_experiment: temporal
  validation_fraction: 0.15
  test_fraction: 0.20
  temporal_gap_days: 0

models:
  naive_baseline: {enabled: true}
  logistic_regression: {enabled: true, C: 1.0, max_iter: 500, class_weight: balanced}
  random_forest: {enabled: true, n_estimators: 100, max_depth: 8, min_samples_leaf: 3, class_weight: balanced_subsample}
  xgboost: {enabled: true, n_estimators: 100, max_depth: 4, learning_rate: 0.06, subsample: 0.8, colsample_bytree: 0.8}
  lightgbm: {enabled: true, n_estimators: 100, num_leaves: 24, learning_rate: 0.06}
  catboost: {enabled: true, iterations: 100, depth: 5, learning_rate: 0.06}
  mlp: {enabled: true, hidden_dims: [64, 32], dropout: 0.25, batch_size: 64, max_epochs: 12, patience: 3, learning_rate: 0.001, losses: [bce]}
  lstm: {enabled: true, hidden_size: 32, num_layers: 1}
  gru: {enabled: true, hidden_size: 32, num_layers: 1}
  bilstm: {enabled: true, hidden_size: 24, num_layers: 1}
  transformer: {enabled: true, d_model: 32, nhead: 4, num_layers: 1, dim_feedforward: 64}
  sequence_training: {batch_size: 64, max_epochs: 8, patience: 2, learning_rate: 0.001}

tuning: {enabled: false, engine: auto, n_trials: 5, scoring: average_precision, n_jobs: -1}

evaluation:
  top_fractions: [0.01, 0.05, 0.10, 0.20, 0.30]
  threshold_strategy: max_f1
  fixed_threshold: 0.5
  target_recall: 0.70
  bootstrap_iterations: 100
  confidence_level: 0.95
  calibration_bins: 8
  calibrators: [none, sigmoid, isotonic]
  select_on: pr_auc

hcp:
  attribution_rule: most_recent_relevant_prescriber
  relevant_specialties: [rheumatology, dermatology, gastroenterology]
  high_propensity_threshold_percentile: 90
  opportunity_score: {expected_switchers_weight: 0.60, high_propensity_patients_weight: 0.25, eligible_patients_weight: 0.15}

visualizations: {enabled: true, dpi: 100, formats: [png]}

explainability: {enabled: true, prefer_shap: true, max_samples: 200, permutation_repeats: 2}

recommendation: {material_pr_auc_gain: 0.01}
