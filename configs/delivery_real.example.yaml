# Paths are resolved from configs/private/delivery.yaml after setup.
benchmark_config: benchmark.yaml
overrides: {}
delivery:
  scoring_date: null
  patient_fraction: 0.1
  feature_contract_version: actual-claims-v1
  data_scope: Real raw-data cohort; independent baseline evaluation
  adapter: therapy_switch.delivery.adapters:load_raw
  output_dir: ../../outputs/field_delivery
  artifact_dir: ../../artifacts/field_delivery
  model:
    trainer: therapy_switch.models.baselines:fit_baselines
    evidence_status: independent_baseline
    parameters: {}
  hcp:
    attribution_rule: most_recent_relevant_prescriber
    relevant_specialties: []
    minimum_priority_patients: 1
    tier_rank_percentiles:
    - 0.2
    - 0.5
extraction:
  sql_dir: ../../sql_extraction
  output_dir: ../../actual_raw_data
  connection_name: null
  max_rows_per_table: 1000000
