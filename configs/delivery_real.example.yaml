# Paths assume setup_real_data.py copies this file to configs/private/delivery.yaml.
benchmark_config: benchmark.yaml
overrides: {}
delivery:
  scoring_date: null
  patient_fraction: 0.1
  feature_contract_version: actual-claims-v1
  data_scope: Actual Snowflake extract; model validation pending
  adapter: therapy_switch.delivery.adapters:load_raw
  output_dir: ../../outputs/client_delivery
  artifact_dir: ../../artifacts/client_delivery
  model:
    trainer: therapy_switch.delivery.model_plugins:fit_recipe
    recipe: ../field_model.json
    evidence_status: experimental
  hcp:
    attribution_rule: most_recent_relevant_prescriber
    relevant_specialties: []
    minimum_priority_patients: 1
    tier_rank_percentiles:
    - 0.2
    - 0.5
extraction:
  sql_dir: sql
  output_dir: ../../data/raw
  connection_name: null
  max_rows_per_table: 1000000
