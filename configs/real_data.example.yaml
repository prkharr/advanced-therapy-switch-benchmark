# Independent raw-data cohort. Complete the null definitions before running.
project:
  name: independent_therapy_baselines
  random_seed: 42
  output_dir: ../../outputs/field_delivery
  artifact_dir: ../../artifacts/field_delivery
data:
  kind: real
  source: files
  input_dir: ../../actual_raw_data
  file_format: csv
  as_of_date: null
  extract_version: null
  require_export_manifest: false
timeline:
  observation_window_days: null
  prediction_window_days: null
  minimum_history_days: null
  minimum_followup_days: null
  index_date_strategy: monthly
  snapshots_per_patient: 3
  claims_lag_days: null
  label_runout_days: null
  index_date_start: null
  index_date_end: null
therapy_mapping:
  conventional:
    drug_ids: []
    therapy_classes:
    - conventional
  advanced:
    drug_ids: []
    therapy_classes:
    - advanced
cohort:
  cohort_id: null
  require_diagnosis_confirmation: null
  diagnosis_codes: []
  confirmation_codes: []
  diagnosis_separation_days: null
  coverage_window_days: null
  minimum_covered_days: null
  maximum_gap_days: null
  require_conventional_on_index: null
features:
  rolling_windows_days:
  - 30
  - 60
  - 90
  - 180
  - 365
  include_geography: true
  missing_recency_value_days: 730
  specialist_specialties: []
  symptom_codes: []
  comorbidity_codes: []
  sequence:
    max_length: 96
    vocab_min_frequency: 2
splitting:
  experiments:
  - temporal
  primary_experiment: temporal
  validation_fraction: 0.2
  test_fraction: 0.2
  temporal_gap_days: 0
models: {}
evaluation:
  top_fractions:
  - 0.1
source_definitions:
  cohort: null
  target: null
  availability: null
  status: null
  observation: null
  therapy_mapping: null
  diagnosis_normalization: null
