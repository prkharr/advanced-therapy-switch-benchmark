name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - python: "3.10"
            profile: core
          - python: "3.11"
            profile: benchmark
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU neural runtime
        if: matrix.profile == 'benchmark'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install core development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install benchmark dependencies
        if: matrix.profile == 'benchmark'
        run: python -m pip install -e ".[benchmark]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
